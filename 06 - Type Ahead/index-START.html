<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Type Ahead 👀</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <form class="search-form">
    <input type="text" class="search" placeholder="City or State">
    <ul class="suggestions">
      <li>Filter for a city</li>
      <li>or a state</li>
    </ul>
  </form>
<script>
  const endpoint = 'https://gist.githubusercontent.com/Miserlou/c5cd8364bf9b2420bb29/raw/2bf258763cdddd704f8ffd3ea9a3e81d25e2c6f6/cities.json';
  
  const cities = [];

  // Get data
  async function getData() {
      const response = await fetch(endpoint);

      const json = await response.json();
      return json;
  }

  let data = getData().then(data => cities.push(...data));

  // Get input
  const input = document.querySelector(".search");
  const suggestions = document.querySelector(".suggestions");
  input.addEventListener("input", displayMatches);
  
  function findMatches(wordToMatch, cities) {
    return cities.filter(place => {
      const regex = new RegExp(wordToMatch, 'gi');
      return place.city.match(regex) || place.state.match(regex);
    });
  }

  function displayMatches() {
    const matchArray = findMatches(this.value, cities);
    console.log(matchArray)
    if (matchArray.length === cities.length || matchArray.length === 0){
      suggestions.innerHTML = "<li>Filter for a city</li>";
      suggestions.innerHTML += "<li>or a state</li>"
    } else {
      suggestions.innerHTML = "";
      matchArray.forEach(element => {
        const regex = new RegExp(this.value, 'gi');
        const cityName = element.city.replace(regex, `<span class="hl">${this.value}</span>`)
        const stateName = element.state.replace(regex, `<span class="hl">${this.value}</span>`)
        const li = document.createElement("li");
        li.innerHTML = `<span class="name">${cityName}, ${stateName}</span> <span class="population">${numberWithCommas(element.population)}</span>`;
        suggestions.append(li);
      });
    }
  }

  function numberWithCommas(x){
    return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  
</script>
</body>
</html>
