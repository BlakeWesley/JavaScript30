<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mouse Shadow</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <div class="hero">
    <h1 contenteditable>🔥WOAH!</h1>
  </div>

  <style>
  html {
    color: black;
    font-family: sans-serif;
  }

  body {
    margin: 0;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: black;
  }

  h1 {
    text-shadow: 10px 10px 0 rgba(0,0,0,1);
    font-size: 100px;
  }
  </style>

<script>
  const hero = document.querySelector('.hero');
  const text = hero.querySelector('h1');
  const walk = 100; // 100px

  function shadow(e) {
    // const width = hero.offsetWidth;
    // const height = hero.offsetHeight;
    const { offsetWidth: width, offsetHeight: height } = hero; // The width and height of the hero (in this case the whole visible window)
    let { offsetX: x, offsetY: y } = e; // Position of cursor
    
    // Below, 'this' is what we are listening on (hero) and e.target can sometimes be a child of hero
    if (this !== e.target) {
      x += e.target.offsetLeft; // adds the offset of what we hover over to the x value, to ensure absolute x position.
      y += e.target.offsetTop; // Same for y but from top
    }

    const xWalk = Math.round((x / width * walk) - (walk / 2));
    const yWalk = Math.round((y / height * walk) - (walk / 2));

    text.style.textShadow = `
    ${xWalk}px ${yWalk}px 0 rgba(255, 0, 255, 0.7),
    ${xWalk * -1}px ${yWalk * -1}px 0 rgba(0, 255, 255, 0.7)

    `;

    // console.log(x, y)
  }

  hero.addEventListener("mousemove", shadow)
</script>
</body>
</html>
