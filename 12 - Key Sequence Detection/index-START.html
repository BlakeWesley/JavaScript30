<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Key Detection</title>
    <script type="text/javascript" src="./cornify.js"></script>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <script>
      const pressed = [];
      const secretKey = "blakey"
      document.addEventListener("keyup", (e) => {
        if (pressed.length === secretKey.length){
          pressed.splice(0, 1)
        }
        pressed.push(e.key);
        console.log(pressed)
        if (pressed.join("").includes(secretKey)){
          console.log("GREAT SUCCESS!");
        }
      });




    </script>
  </body>
</html>
