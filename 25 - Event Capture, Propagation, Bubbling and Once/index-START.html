<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Understanding JavaScript's Capture</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body class="bod">

  <div class="one">
    <div class="two">
      <div class="three">
      </div>
    </div>
  </div>

<style>
  html {
    box-sizing: border-box;
  }

  *, *:before, *:after {
    box-sizing: inherit;
  }

  div {
    width: 100%;
    padding: 100px;
  }

  .one {
    background: thistle;
  }

  .two {
    background: mistyrose;
  }

  .three {
    background: coral;
  }
</style>

<button></button>
<script>
  const divs = document.querySelectorAll('div');

  function logText(e) {
    console.log(this.classList.value);
    // e.stopPropagation(); // This stops the bubbling from happening.
  }

  divs.forEach(div => div.addEventListener("click", logText, { 
    // capture: true // This fires the events on the capture down, rather than the bubble up.
    once: true // This listens for a click once and then unbinds itself (which is the same as doing removeEventListener(...))
    
    }));
</script>
</body>
</html>
